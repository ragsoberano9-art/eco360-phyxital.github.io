<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO-360 Phyxital Solutions — Red de Nodos San Rafael</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    /* Estilo de Popup en paleta Luxury Industrial */
    .leaflet-popup-content-wrapper {
      background: #161b22;
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background: #161b22;
    }
    .nodo-title {
      font-weight: 700;
      font-size: 1.1em;
      color: #00F0FF;
      margin-bottom: 4px;
    }
    .nodo-meta {
      font-size: 0.85em;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .nodo-desc {
      font-size: 0.9em;
      color: #c9d1d9;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 1. Inicializar mapa centrado en San Rafael, Mendoza
  const map = L.map('map').setView([-34.6177, -68.3301], 10);

  // 2. Capa Satelital Esri World Imagery (Sin costo de API)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; ECO-360 Phyxital Solutions'
  }).addTo(map);

  // 3. Capa de nombres y rutas de referencia
  L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: ''
  }).addTo(map);

  // 4. Ingesta dinámica del GeoJSON de los 29 Nodos
  fetch('./mapa_nodos_eco360.geojson')
    .then(response => response.json())
    .then(data => {
      L.geoJSON(data, {
        pointToLayer: function(feature, latlng) {
          const props = feature.properties;
          const colorHex = props.color || '#00F0FF';
          const radiusKm = props.cobertura_km || 3;

          // Círculo de Cobertura LoRa (Sub-GHz)
          L.circle(latlng, {
            radius: radiusKm * 1000,
            color: colorHex,
            fillColor: colorHex,
            fillOpacity: 0.15,
            weight: 1.5,
            dashArray: '4, 4'
          }).addTo(map);

          // Marcador central del Nodo
          return L.circleMarker(latlng, {
            radius: 7,
            fillColor: colorHex,
            color: '#FFFFFF',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          });
        },
        onEachFeature: function(feature, layer) {
          const p = feature.properties;
          const popupContent = `
            <div class="nodo-title">${p.nombre}</div>
            <div class="nodo-meta">📍 Tipo: ${p.tipo} | 📡 Cobertura: ${p.cobertura_km} km (${p.frecuencia})</div>
            <div class="nodo-desc">${p.descripcion}</div>
          `;
          layer.bindPopup(popupContent);
        }
      }).addTo(map);
    })
    .catch(err => console.error('Error al cargar el GeoJSON de nodos:', err));
</script>

</body>
</html>
